<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frontdesk — log in</title>
<style>
  :root {
    --bg: #0a0b0d; --card: #14161a; --text: #f3f4f6; --muted: #9aa1ac;
    --accent2: #35d68f; --border: #22262d; --bg2: #0d0f12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(900px 480px at 15% -10%, rgba(47,143,224,.16), transparent 60%), var(--bg);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 20px;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 400px; width: 100%; }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; margin-bottom: 22px; }
  .logo .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 12px rgba(53,214,143,.8); }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 20px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input[type=email] {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); font-size: 14px; font-family: inherit; margin-bottom: 14px;
  }
  button {
    width: 100%; background: var(--accent2); color: #04160c; border: none; border-radius: 9px;
    padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: .6; cursor: default; }
  .status { font-size: 13px; margin-top: 14px; min-height: 18px; color: var(--muted); }
  .status.ok { color: var(--accent2); }
  a.back { color: var(--muted); text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <a class="logo" href="index.html"><span class="dot"></span>Frontdesk</a>
    <h1>Log in to your dashboard</h1>
    <p>Enter the email address you signed up with - we'll send you a one-time login link, no password needed.</p>
    <form id="login-form">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@yourbusiness.com" required />
      <button type="submit" id="submit-btn">Send login link</button>
    </form>
    <div class="status" id="status"></div>
    <p style="margin-top:20px;"><a class="back" href="index.html">&larr; Back to home</a></p>
  </div>

  <script>
    (function () {
      var form = document.getElementById("login-form");
      var btn = document.getElementById("submit-btn");
      var statusEl = document.getElementById("status");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim();
        if (!email) return;

        btn.disabled = true;
        btn.textContent = "Sending...";
        statusEl.className = "status";
        statusEl.textContent = "";

        fetch("/api/request-login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email })
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            statusEl.className = "status ok";
            statusEl.textContent = data.message || "If that email is registered, a login link is on its way - check your inbox.";
            btn.textContent = "Link sent";
          })
          .catch(function () {
            btn.disabled = false;
            btn.textContent = "Send login link";
            statusEl.className = "status";
            statusEl.textContent = "Something went wrong - please try again.";
          });
      });
    })();
  </script>
</body>
</html>
