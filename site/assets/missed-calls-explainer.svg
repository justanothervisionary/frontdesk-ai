<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="explainer-title explainer-desc">
  <title id="explainer-title">Before and after Frontdesk</title>
  <desc id="explainer-desc">Left: a phone rings unanswered at 9:47pm, no one picks up. Right: the same enquiry, answered instantly by the AI receptionist, lead captured.</desc>

  <defs>
    <clipPath id="cardclip-l"><rect x="20" y="20" width="390" height="280" rx="18"/></clipPath>
    <clipPath id="cardclip-r"><rect x="490" y="20" width="390" height="280" rx="18"/></clipPath>
  </defs>

  <!-- Left card: missed call -->
  <rect x="20" y="20" width="390" height="280" rx="18" fill="#14161a" stroke="#22262d"/>
  <text x="46" y="58" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6b7280">WITHOUT AN AI RECEPTIONIST</text>

  <!-- clock -->
  <circle cx="80" cy="120" r="26" fill="none" stroke="#6b7280" stroke-width="2.5"/>
  <path d="M80 108 L80 120 L90 126" stroke="#6b7280" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="116" font-family="-apple-system,Segoe UI,sans-serif" font-size="14" fill="#9aa1ac">9:47pm</text>
  <text x="118" y="134" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#6b7280">Closed for the day</text>

  <!-- phone with missed call -->
  <rect x="63" y="168" width="34" height="58" rx="8" fill="none" stroke="#6b7280" stroke-width="2.5"/>
  <circle cx="80" cy="214" r="2.5" fill="#6b7280"/>
  <circle cx="98" cy="176" r="10" fill="#e2493a"/>
  <path d="M94 176 L102 176 M98 172 L98 180" stroke="#14161a" stroke-width="2" stroke-linecap="round" transform="rotate(45 98 176)"/>
  <text x="118" y="182" font-family="-apple-system,Segoe UI,sans-serif" font-size="14" fill="#f2837a" font-weight="600">Missed call</text>
  <text x="118" y="200" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#6b7280">No one picked up</text>

  <line x1="46" y1="240" x2="384" y2="240" stroke="#22262d"/>
  <text x="46" y="270" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="#9aa1ac">The caller rings the next business instead.</text>

  <!-- Arrow -->
  <path d="M420 160 L480 160" stroke="#35d68f" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#35d68f"/>
    </marker>
  </defs>

  <!-- Right card: AI answers -->
  <rect x="490" y="20" width="390" height="280" rx="18" fill="#14161a" stroke="#35d68f" stroke-opacity="0.4"/>
  <text x="516" y="58" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#35d68f">WITH FRONTDESK</text>

  <!-- chat bubble -->
  <rect x="533" y="100" width="150" height="56" rx="14" fill="#1a1d22" stroke="#22262d"/>
  <circle cx="558" cy="128" r="14" fill="#35d68f"/>
  <path d="M552 128 Q558 134 564 126" stroke="#04160c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="583" y="124" font-family="-apple-system,Segoe UI,sans-serif" font-size="11.5" fill="#f3f4f6" font-weight="600">Hi! I&#8217;m Jade</text>
  <text x="583" y="140" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#9aa1ac">How can I help?</text>

  <!-- reply bubble -->
  <rect x="583" y="168" width="180" height="44" rx="12" fill="#35d68f"/>
  <text x="600" y="186" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#04160c" font-weight="600">Can I book for Saturday?</text>
  <text x="600" y="202" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#093c26">Sent 9:47pm</text>

  <!-- checkmark badge -->
  <circle cx="850" cy="130" r="18" fill="#35d68f"/>
  <path d="M842 130 L848 137 L860 122" stroke="#04160c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="516" y1="240" x2="854" y2="240" stroke="#22262d"/>
  <text x="516" y="270" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="#f3f4f6" font-weight="600">Answered instantly. Lead captured. You wake up to a booking.</text>
</svg>
